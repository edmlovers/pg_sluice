[package]
name = "sluice-core"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
arrayvec = "0.7.8"
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde"] }
memchr = "2.8.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "parse_tags"
harness = false
