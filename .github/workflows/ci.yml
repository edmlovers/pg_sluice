name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Pure-Rust crates: no Postgres needed.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude pg_sluice --all-targets
      - run: cargo test --workspace --exclude pg_sluice

  # The extension builds against a real Postgres 18 and its tests run inside one.
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Postgres 18
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18 postgresql-server-dev-18
          # cargo pgrx test installs the extension into these directories.
          sudo chmod a+rwx "$(/usr/lib/postgresql/18/bin/pg_config --pkglibdir)" \
                           "$(/usr/lib/postgresql/18/bin/pg_config --sharedir)/extension"
      - run: cargo install --locked cargo-pgrx --version 0.19.3
      - run: cargo pgrx init --pg18 /usr/lib/postgresql/18/bin/pg_config
      - run: cargo clippy -p pg_sluice --all-targets
      - run: cargo pgrx test pg18 -p pg_sluice
