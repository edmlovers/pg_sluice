[workspace]
resolver = "3"
members = [
    "crates/sluice-core",
    "crates/pg_sluice",
    "crates/sluice-cli",
    "crates/sluice-client",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
repository = "https://github.com/edmlovers/pg_sluice"

[workspace.dependencies]
sluice-core = { path = "crates/sluice-core" }
